[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "baresipy"
dynamic = ["version"]
description = "python baresip wrapper"
license = {text = "MIT"}
authors = [{name = "JarbasAI", email = "jarbasai@mailfence.com"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opentone>=0.1.2",
    "pydub",
    "audioop-lts; python_version >= '3.13'",
    "pexpect",
    "json_database>=0.1.2",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "fastapi",
    "httpx>=0.27,<1.0",
    "python-multipart",
    "uvicorn",
]
ovos = [
    "ovos-plugin-manager",
    "phoonnx",
    "ovos-simple-listener",
]
server = [
    "fastapi",
    "uvicorn",
    "python-multipart",
]

[project.scripts]
baresipy-gateway = "baresipy.server:main"

[project.urls]
Homepage = "https://github.com/TigreGotico/baresipy"

[tool.setuptools.dynamic]
version = {attr = "baresipy.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
addopts = "-m 'not e2e'"
markers = ["e2e: end-to-end tests requiring docker"]
